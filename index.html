<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    height: 100vh; width: 100vw;
    overflow: hidden;
    user-select: none;
  }

  /* START SCREEN */
  #start-screen {
    position: fixed; inset: 0; background: #ffffff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 36px; z-index: 100;
  }
  #start-screen h1 { color: #222; font-size: 4.5vw; font-weight: 700; letter-spacing: 2px; text-align: center; }
  #start-screen p { color: #666; font-size: 2.2vw; text-align: center; }
  #start-btn {
    background: #3d5af1; color: white; border: none;
    border-radius: 20px; padding: 26px 80px;
    font-size: 3vw; font-weight: 700; cursor: pointer;
  }
  #start-btn:active { transform: scale(0.97); }
  #fs-btn-start {
    background: transparent; color: #3d5af1;
    border: 2px solid #3d5af1; border-radius: 14px;
    padding: 14px 40px; font-size: 1.8vw; font-weight: 600; cursor: pointer;
  }

  /* SCOREBOARD */
  #scoreboard {
    display: none;
    width: 100vw; height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    position: relative;
    padding: 2vh 3vw;
    gap: 0;
  }

  .club-header {
    font-size: 4vw; font-weight: 800; color: #3d5af1;
    letter-spacing: 8px; text-transform: uppercase; text-align: center;
    margin-bottom: 0.5vh;
  }
  .game-title {
    font-size: 1.5vw; font-weight: 500; color: #aaaaaa;
    letter-spacing: 3px; text-transform: uppercase; text-align: center;
    margin-bottom: 1.5vh;
  }

  /* KEHREN-REIHE — kompakt, über dem Hauptspielstand */
  .kehren-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5vw;
    margin-bottom: 1.5vh;
  }

  .k-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 5vw;
  }

  .k-nr {
    font-size: 0.85vw;
    font-weight: 600;
    color: #cccccc;
    letter-spacing: 1px;
  }

  .k-scores {
    display: flex;
    align-items: center;
    gap: 0.2vw;
    font-size: 2.2vw;
    font-weight: 900;
    line-height: 1;
  }

  .k-sep {
    font-size: 1.6vw;
    font-weight: 700;
    color: #dddddd;
    padding-bottom: 0.1vw;
  }

  .k-s1 { color: #3d5af1; }
  .k-s2 { color: #f15a3d; }
  .k-draw-val { color: #bbbbbb; font-size: 1.6vw !important; }
  .k-empty { color: #e8e8e8; font-size: 1.6vw !important; }

  /* Aktive Kehre leicht hervorgehoben */
  .k-item.k-active .k-nr { color: #3d5af1; }
  .k-item.k-active .k-scores { opacity: 0.4; }

  /* Trennstrich zwischen Kehren */
  .k-divider {
    width: 1px;
    height: 3.5vw;
    background: #eeeeee;
    align-self: center;
    margin-bottom: 1.2vw;
  }

  /* GESAMT-ZEILE */
  .gesamt-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1vw;
    margin-bottom: 0.5vh;
  }
  .gesamt-label {
    font-size: 1.2vw; font-weight: 600; color: #bbbbbb;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .gesamt-scores {
    font-size: 1.5vw; font-weight: 700;
  }
  .g-s1 { color: #3d5af1; }
  .g-s2 { color: #f15a3d; }
  .g-sep { color: #cccccc; }

  /* HAUPT-SCORE */
  .main-score-area {
    display: flex; align-items: center; justify-content: center;
    gap: 1.5vw; width: 100%;
  }
  .team-col { display: flex; flex-direction: column; align-items: center; gap: 0.3vh; }
  .team-name { font-size: 2.2vw; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .t1-color { color: #3d5af1; }
  .t2-color { color: #f15a3d; }
  .big-score { font-size: 28vw; font-weight: 900; line-height: 0.85; }
  .big-colon { font-size: 20vw; font-weight: 900; color: #999999; line-height: 0.85; padding-bottom: 4vw; }

  /* WINNER BANNER */
  #winner-banner {
    display: none; position: absolute; top: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.97); padding: 2vh 4vw;
    text-align: center; z-index: 10; border-bottom: 2px solid #eeeeee;
  }
  #winner-text { font-size: 4vw; font-weight: 900; letter-spacing: 3px; }
  #winner-sub { font-size: 1.6vw; color: #666; margin-top: 0.3vh; letter-spacing: 2px; }

  /* BUTTONS */
  #enter-btn {
    position: fixed; bottom: 3vh; right: 3vw;
    background: #3d5af1; color: white; border: none; border-radius: 50%;
    width: 7vw; height: 7vw; min-width: 58px; min-height: 58px;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px #3d5af144; z-index: 20;
    transition: transform 0.1s;
  }
  #enter-btn:active { transform: scale(0.93); }
  #enter-btn svg { width: 36%; height: 36%; }
  #enter-btn.disabled { background: #cccccc; box-shadow: none; pointer-events: none; }

  #reset-btn {
    position: fixed; bottom: 3vh; left: 3vw;
    background: #eeeeee; color: #888; border: none; border-radius: 50%;
    width: 5.5vw; height: 5.5vw; min-width: 48px; min-height: 48px;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    z-index: 20; transition: transform 0.1s;
  }
  #reset-btn:hover { background: #dddddd; }
  #reset-btn:active { transform: scale(0.93); }
  #reset-btn svg { width: 50%; height: 50%; }

  /* INPUT OVERLAY */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 50;
    align-items: flex-end; justify-content: flex-end; padding: 0 3vw 14vh 0;
  }
  .overlay.active { display: flex; }

  .input-panel {
    background: #ffffff; border-radius: 20px; padding: 2vh 3.5vw;
    width: 44vw; max-width: 580px; min-width: 360px;
    border: 1px solid #dddddd; box-shadow: 0 8px 40px #00000022;
  }
  .panel-title { color: #222; font-size: 1.6vw; font-weight: 700; margin-bottom: 0.3vh; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
  .panel-subtitle { color: #3d5af1; font-size: 1.3vw; font-weight: 600; text-align: center; margin-bottom: 1.5vh; }
  .panel-scores { display: flex; align-items: center; justify-content: center; gap: 1.5vw; margin-bottom: 2vh; }
  .panel-team { display: flex; flex-direction: column; align-items: center; gap: 1.5vh; }
  .panel-team-label { font-size: 1.2vw; font-weight: 600; color: #666; }
  .score-control { display: flex; align-items: center; gap: 0.8vw; }
  .score-btn {
    width: 4vw; height: 4vw; min-width: 40px; min-height: 40px;
    border-radius: 50%; border: 2px solid; background: transparent;
    font-size: 2.2vw; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s;
  }
  .score-btn:active { transform: scale(0.9); }
  .pt1 .score-btn { border-color: #3d5af1; color: #3d5af1; }
  .pt2 .score-btn { border-color: #f15a3d; color: #f15a3d; }
  .panel-score-num { font-size: 4.5vw; font-weight: 900; min-width: 5vw; text-align: center; line-height: 1; }
  .pt1 .panel-score-num { color: #3d5af1; }
  .pt2 .panel-score-num { color: #f15a3d; }
  .panel-colon { font-size: 3vw; font-weight: 900; color: #cccccc; padding-bottom: 1.5vw; }
  .panel-actions { display: flex; gap: 12px; justify-content: center; }
  .btn-save { background: #3d5af1; color: white; border: none; border-radius: 10px; padding: 12px 30px; font-size: 1.4vw; font-weight: 700; cursor: pointer; flex: 1; transition: transform 0.1s; }
  .btn-save:active { transform: scale(0.97); }
  .btn-cancel { background: #eeeeee; color: #666; border: none; border-radius: 10px; padding: 12px 20px; font-size: 1.4vw; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
  .btn-cancel:active { transform: scale(0.97); }

  /* CONFIRM */
  .confirm-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 60;
    align-items: center; justify-content: center;
  }
  .confirm-overlay.active { display: flex; }
  .confirm-box { background: #fff; border-radius: 24px; padding: 4vh 4vw; text-align: center; border: 1px solid #ddd; max-width: 500px; width: 90%; box-shadow: 0 8px 40px #00000020; }
  .confirm-box h2 { color: #222; font-size: 2.5vw; margin-bottom: 1.5vh; }
  .confirm-box p { color: #666; font-size: 1.8vw; margin-bottom: 3vh; }
  .confirm-btns { display: flex; gap: 16px; justify-content: center; }
  .btn-confirm-yes { background: #e03030; color: white; border: none; border-radius: 12px; padding: 14px 40px; font-size: 1.8vw; font-weight: 700; cursor: pointer; }
  .btn-confirm-no { background: #eee; color: #666; border: none; border-radius: 12px; padding: 14px 40px; font-size: 1.8vw; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Stocksport Wertung</h1>
  <h2 style="color:#3d5af1; font-size:3.2vw; font-weight:700; letter-spacing:2px;">EV Straßwalchen</h2>
  <p>6 Kehren — je max. 10 Punkte pro Kehre</p>
  <button id="start-btn" onclick="startGame()">▶ Spiel starten</button>
  <button id="fs-btn-start" onclick="goFullscreen()">⛶ Vollbild aktivieren</button>
</div>

<div id="scoreboard">
  <div class="club-header">EV Straßwalchen</div>
  <div class="game-title" id="game-title">Kehre 1 von 6</div>

  <!-- Kehren als kompakte Zahlenreihe -->
  <div class="kehren-strip" id="kehren-strip"></div>

  <!-- Haupt-Spielstand -->
  <div class="main-score-area">
    <div class="team-col">
      <div class="big-score t1-color" id="score1">0</div>
      <div class="team-name t1-color">Team 1</div>
    </div>
    <div class="big-colon">:</div>
    <div class="team-col">
      <div class="big-score t2-color" id="score2">0</div>
      <div class="team-name t2-color">Team 2</div>
    </div>
  </div>

  <div id="winner-banner">
    <div id="winner-text"></div>
    <div id="winner-sub"></div>
  </div>
</div>

<button id="enter-btn" onclick="openInput()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
</button>

<button id="reset-btn" onclick="confirmReset()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="1 4 1 10 7 10"></polyline>
    <path d="M3.51 15a9 9 0 1 0 .49-4.95"></path>
  </svg>
</button>

<div class="overlay" id="input-overlay">
  <div class="input-panel">
    <div class="panel-title">Kehre eingeben</div>
    <div class="panel-subtitle" id="panel-label">Kehre 1 von 6</div>
    <div class="panel-scores">
      <div class="panel-team pt1">
        <div class="panel-team-label">Team 1</div>
        <div class="score-control">
          <button class="score-btn" onclick="changeScore(1,-1)">−</button>
          <div class="panel-score-num" id="input-s1">0</div>
          <button class="score-btn" onclick="changeScore(1,+1)">+</button>
        </div>
      </div>
      <div class="panel-colon">:</div>
      <div class="panel-team pt2">
        <div class="panel-team-label">Team 2</div>
        <div class="score-control">
          <button class="score-btn" onclick="changeScore(2,-1)">−</button>
          <div class="panel-score-num" id="input-s2">0</div>
          <button class="score-btn" onclick="changeScore(2,+1)">+</button>
        </div>
      </div>
    </div>
    <div class="panel-actions">
      <button class="btn-cancel" onclick="closeInput()">Abbrechen</button>
      <button class="btn-save" onclick="saveScore()">Speichern</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h2>Neues Spiel?</h2>
    <p>Alle Kehren werden zurückgesetzt.</p>
    <div class="confirm-btns">
      <button class="btn-confirm-no" onclick="closeConfirm()">Abbrechen</button>
      <button class="btn-confirm-yes" onclick="doReset()">Zurücksetzen</button>
    </div>
  </div>
</div>

<script>
  var MAX_SCORE = 10;
  var MAX_K = 6;
  var scores = [];
  var currentK = 0;
  var gameOver = false;
  var transitioning = false;

  function goFullscreen() {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    var sb = document.getElementById('scoreboard');
    sb.style.display = 'flex';
    document.getElementById('enter-btn').style.display = 'flex';
    document.getElementById('reset-btn').style.display = 'flex';
    initGame();
  }

  function initGame() {
    scores = [];
    for (var i = 0; i < MAX_K; i++) scores.push(null);
    currentK = 0;
    gameOver = false;
    transitioning = false;
    document.getElementById('enter-btn').classList.remove('disabled');
    document.getElementById('winner-banner').style.display = 'none';
    updateDisplay();
  }

  function updateDisplay() {
    var tot1 = 0, tot2 = 0, wins1 = 0, wins2 = 0;
    for (var i = 0; i < MAX_K; i++) {
      if (scores[i]) {
        tot1 += scores[i].s1;
        tot2 += scores[i].s2;
        if (scores[i].s1 > scores[i].s2) wins1++;
        else if (scores[i].s2 > scores[i].s1) wins2++;
      }
    }

    document.getElementById('score1').textContent = tot1;
    document.getElementById('score2').textContent = tot2;

    document.getElementById('game-title').textContent = gameOver
      ? 'Spiel beendet'
      : 'Kehre ' + (currentK + 1) + ' von ' + MAX_K;

    // Kehren-Strip aufbauen
    var strip = document.getElementById('kehren-strip');
    strip.innerHTML = '';
    for (var k = 0; k < MAX_K; k++) {
      // Trennstrich zwischen Kehren
      if (k > 0) {
        var div = document.createElement('div');
        div.className = 'k-divider';
        strip.appendChild(div);
      }

      var dg = scores[k];
      var isActive = (k === currentK && !gameOver && !transitioning);
      var isDone = (dg !== null);

      var item = document.createElement('div');
      item.className = 'k-item' + (isActive ? ' k-active' : '');

      var nr = document.createElement('div');
      nr.className = 'k-nr';
      nr.textContent = k + 1;
      item.appendChild(nr);

      var ks = document.createElement('div');
      ks.className = 'k-scores';

      if (isDone) {
        // Nur die Punkte des Gewinnerteams anzeigen, in dessen Farbe
        var winner = document.createElement('span');
        if (dg.s1 > dg.s2) {
          winner.className = 'k-s1';
          winner.textContent = dg.s1;
        } else if (dg.s2 > dg.s1) {
          winner.className = 'k-s2';
          winner.textContent = dg.s2;
        } else {
          // Unentschieden: beide Punkte grau mit Doppelpunkt
          winner.className = 'k-draw-val';
          winner.textContent = dg.s1 + ':' + dg.s2;
        }
        ks.appendChild(winner);
      } else {
        var ph = document.createElement('span');
        ph.className = isActive ? 'k-s1 k-empty' : 'k-empty';
        ph.textContent = isActive ? '—' : '';
        ks.appendChild(ph);
      }

      item.appendChild(ks);
      strip.appendChild(item);
    }

    // Winner Banner
    var banner = document.getElementById('winner-banner');
    if (gameOver) {
      var color, winner;
      if (wins1 > wins2) { color = '#3d5af1'; winner = 'Team 1'; }
      else if (wins2 > wins1) { color = '#f15a3d'; winner = 'Team 2'; }
      else if (tot1 > tot2) { color = '#3d5af1'; winner = 'Team 1'; }
      else if (tot2 > tot1) { color = '#f15a3d'; winner = 'Team 2'; }
      else { color = '#888888'; winner = 'Unentschieden'; }
      document.getElementById('winner-text').innerHTML =
        '<span style="color:' + color + '">' + winner + '</span> gewinnt! 🏆';
      document.getElementById('winner-sub').textContent =
        'Kehren: ' + wins1 + ' : ' + wins2 + '  |  Punkte gesamt: ' + tot1 + ' : ' + tot2;
      banner.style.display = 'block';
      document.getElementById('enter-btn').classList.add('disabled');
    } else {
      banner.style.display = 'none';
    }
  }

  function openInput() {
    if (gameOver || transitioning) return;
    document.getElementById('input-s1').textContent = '0';
    document.getElementById('input-s2').textContent = '0';
    document.getElementById('panel-label').textContent = 'Kehre ' + (currentK + 1) + ' von ' + MAX_K;
    document.getElementById('input-overlay').classList.add('active');
  }

  function closeInput() {
    document.getElementById('input-overlay').classList.remove('active');
  }

  function changeScore(team, delta) {
    var el = document.getElementById(team === 1 ? 'input-s1' : 'input-s2');
    var val = parseInt(el.textContent) || 0;
    val = Math.max(0, Math.min(MAX_SCORE, val + delta));
    el.textContent = val;
  }

  function saveScore() {
    var s1 = parseInt(document.getElementById('input-s1').textContent) || 0;
    var s2 = parseInt(document.getElementById('input-s2').textContent) || 0;
    scores[currentK] = { s1: s1, s2: s2 };
    closeInput();

    if (currentK < MAX_K - 1) {
      transitioning = true;
      updateDisplay();
      setTimeout(function() {
        currentK++;
        transitioning = false;
        updateDisplay();
      }, 2000);
    } else {
      gameOver = true;
      updateDisplay();
    }
  }

  function confirmReset() { document.getElementById('confirm-overlay').classList.add('active'); }
  function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('active'); }
  function doReset() { closeConfirm(); closeInput(); initGame(); }
</script>
</body>
</html>
